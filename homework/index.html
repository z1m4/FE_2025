<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .user-list {
            list-style: none;
            padding: 0;
        }
        .user-item {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f9f9f9;
        }
        .user-info {
            flex-grow: 1;
        }
        .user-actions button {
            margin-left: 10px;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            transition: all 0.3s ease;
        }
        .edit-btn {
            background-color: #4CAF50;
            color: white;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
        }
        .user-actions button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }
        .edit-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px;
        }
        .edit-form input {
            padding: 8px;
            width: 80%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .form-actions {
            display: flex;
            gap: 10px;
        }
        .form-actions button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .save-btn {
            background-color: #2196F3;
            color: white;
        }
        .cancel-btn {
            background-color: #ff9800;
            color: white;
        }
        .page-spinner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #easterEgg {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        #easterEgg button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #easterEgg button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="page-spinner" id="pageSpinner">
        <div class="spinner"></div>
    </div>
    <ul class="user-list" id="userList"></ul>
    <div id="easterEgg" hidden>
        <h2>Чувак ты думал что то здесь будет?</h2>
        <p>ТЫ их убил! Что бы их вернуть нажми на кнопку!</p>
        <button onclick="resetUsers()">Вернуть пользователей</button>
    </div>

    <script src="js/index.js"></script>
</body>
</html>
